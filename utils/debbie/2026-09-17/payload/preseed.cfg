#_preseed_V1
#==============================================================================
# debbie - Debian 13 (trixie) preseed
#
# ARCHITECTURE-NEUTRAL BY CONSTRUCTION - REQ-EMU-005.
#
# There is not one conditional line in this file, and there must never be. The
# fast test loop runs an arm64 guest while the real server is x86_64. If this
# file can tell them apart, the two drift, and the copy that nobody iterates
# on is the one that rots.
#
# Anything genuinely architecture- or run-specific is injected by the harness
# into overrides.cfg, layered on through the preseed/include at the end of this
# file. Later values win.
#
# Notably absent, on purpose:
#   - no grub-efi-amd64 / grub-efi-arm64. grub-installer picks the right one
#     from the detected architecture. Naming it here would break the other arch.
#   - no intel-microcode / amd64-microcode. They do not exist on arm64 and
#     would abort the install. hw-detect adds them on amd64 by itself.
#   - no partman-auto/disk. See the early_command below.
#   - no late_command. Only one may exist across all included files, and the
#     last silently wins, so overrides.cfg owns it.
#==============================================================================

#------------------------------------------------------------------------------
# Localisation
#------------------------------------------------------------------------------
d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/xkb-keymap select gb
# console-setup/ask_detect and console-setup/layoutcode are deprecated. The
# keyboard-configuration key above replaces both.

#------------------------------------------------------------------------------
# Network
#
# Hostname is set in overrides.cfg so the harness and the real machine can differ
# without this file knowing about either - but see the warning below about WHEN
# a netcfg/* key in a fetched preseed can still be read.
#
# NO netcfg/* KEY IN THIS FILE REACHES netcfg IN TIME - REQ-SERVER-004.
#
# This preseed is fetched over the network (`auto url=...`), so netcfg has to
# bring an interface up BEFORE anything in this file is read. The Debian
# installation guide states the consequence flatly: "preseeding the network
# configuration won't work if you're loading your preconfiguration file from
# the network" (B.4.3). When this file arrives, netcfg has run, chosen a
# hostname, and written /etc/hostname.
#
# This fault occurred once. netcfg fell through to a reverse-DNS lookup of the
# DHCP address 192.168.1.182, split it at the first dot, and installed the
# machine as hostname `192` in domain `168.1.182`. Both netcfg/hostname and
# netcfg/get_hostname were correctly preseeded, and netcfg read them too late.
#
# The keys below are kept because they are free and correct if netcfg is ever
# driven from a LOCAL preseed (an initrd preseed, or a file: URL). Nothing may
# DEPEND on them. The two mechanisms that actually bind are both outside this
# file, because both have to sit either earlier or later than it:
#
#   1. the kernel command line. write_overrides in scripts/lib.sh cannot reach
#      netcfg either, so scripts/lib.sh installer_params() and
#      scripts/test-vm/test-vm.sh both put netcfg/hostname= on the boot line,
#      which IS read before netcfg runs.
#   2. preseed/late_command in overrides.cfg, which imposes the hostname on the
#      installed filesystem regardless of anything netcfg decided.
#
# Two other keys look like fixes for this fault. Both are rejected, for these
# reasons:
#
#   netcfg/dhcp_hostname       is the name the client SENDS to the DHCP server,
#                              not one it accepts. In netcfg's dhcp.c it is only
#                              the third fallback for the local hostname, below
#                              netcfg/hostname and below the DHCP-supplied name,
#                              so it cannot outrank what broke this. It is also
#                              a netcfg/* key, so it arrives just as late.
#   netcfg/do_not_use_netplan  chooses what 55netcfg-copy-config writes into the
#                              target - netplan, NetworkManager or ifupdown. It
#                              never touches /etc/hostname or /etc/hosts, so it
#                              is irrelevant to this fault. It may matter to
#                              REQ-NETWORK-004. It does not matter here.
#
# WIFI CREDENTIALS ARE NOT HERE, AND CANNOT BE. The cause is the same
# lateness, with a sharper edge: on wifi netcfg must associate before it can
# fetch this file at
# all, so the ESSID and passphrase must arrive on the kernel command line. See
# scripts/README.md, which prints the exact line.
#
# `choose_interface select auto` picks the first interface with a CARRIER.
# Wifi has none until it associates, so on a wifi-only machine the installer either
# prompts or picks the dead ethernet port. The boot line settles it by naming
# the interface explicitly.
#------------------------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string local
d-i netcfg/dhcp_timeout string 60
d-i netcfg/wireless_wep string

#------------------------------------------------------------------------------
# Mirror - serves every architecture from the same paths
#------------------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

#------------------------------------------------------------------------------
# APT
#------------------------------------------------------------------------------
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

#------------------------------------------------------------------------------
# Accounts - REQ-SERVER-003
#
# Root login is disabled. The deploy user gets sudo. The username and the
# password hash both come from overrides.cfg.
#
# This file holds NO hash, on purpose. This repository is public, and an
# archived generation shipped `password changeme` in the clear for nine months.
# A hash that lives here is a hash that somebody forgets to change. The
# generator in write_overrides in scripts/lib.sh refuses to run unless it gets
# a hash.
#------------------------------------------------------------------------------
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Sean
d-i user-setup/encrypt-home boolean false

# netdev lets the user drive NetworkManager without root. docker is added later
# by setup-server-environment.sh, because the group does not exist at install time.
d-i passwd/user-default-groups string audio cdrom video sudo netdev

#------------------------------------------------------------------------------
# Clock
#------------------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string Europe/London
d-i clock-setup/ntp boolean true

#------------------------------------------------------------------------------
# Partitioning
#
# `atomic` rather than a hand-written expert_recipe: on a GPT/UEFI system
# partman-efi adds the ESP by itself, identically on both architectures. A
# hand-rolled recipe would have to hardcode one.
#------------------------------------------------------------------------------
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman/mount_style select uuid

# Disk selection, once, here, and nowhere else.
#
# Only one mechanism picks the disk. A hardcoded /dev/vda next to an
# early_command that auto-detects gives two mechanisms that fight. The
# hardcoded one is right under QEMU and wrong on metal.
#
# Removable devices are filtered out because on the real laptop `list-devices
# disk` also lists the USB stick the installer booted from, and installing over
# your own installer is a bad afternoon. The VM never sees that case, which is
# exactly why it has to be handled here rather than discovered later.
d-i partman/early_command string \
    DISK=$(for d in $(list-devices disk); do \
      [ "$(cat /sys/block/$(basename $d)/removable 2>/dev/null)" = 1 ] || echo $d; \
    done | head -n1); \
    debconf-set partman-auto/disk "$DISK"; \
    debconf-set grub-installer/bootdev "$DISK"

#------------------------------------------------------------------------------
# Packages - headless
#
# No desktop. An archived preseed installed KDE, which doubled the RAM, disk
# and wall time of every iteration on a machine that had no acceleration.
#
# avahi-daemon, avahi-utils and libnss-mdns are here rather than in
# setup-server-environment.sh because of a bootstrap hole (REQ-SERVER-004).
# You must REACH the machine to run setup-server-environment.sh, and every
# runbook step reaches it as $SERVER_NAME.local. If the setup script installs
# mDNS, the name starts to work only after the step that needed it. Debian
# enables and starts avahi-daemon on install, so the machine answers to its own
# name on first boot, with nothing run by hand.
#
# They depend on the hostname fix above and cannot be separated from it.
# avahi advertises the SYSTEM hostname, so avahi on a machine that netcfg named
# `192` publishes `192.local`, which is no better.
#
# avahi-utils is included, not just the daemon and the NSS module, because
# avahi-resolve is how payload/assert.sh proves the name resolves rather than
# merely that a service is running.
#------------------------------------------------------------------------------
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl ca-certificates avahi-daemon avahi-utils libnss-mdns
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/updatedb boolean false
popularity-contest popularity-contest/participate boolean false

#------------------------------------------------------------------------------
# Bootloader
#
# force-efi-extra-removable writes the fallback \EFI\BOOT\BOOT*.EFI path as well
# as the NVRAM entry. The installer picks the filename for the architecture.
# This path lets the machine boot when vendor firmware quietly drops or
# reorders efibootmgr entries, which is common and which a VM cannot reproduce.
#------------------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

#------------------------------------------------------------------------------
# Finishing
#
# Power off rather than reboot: it turns "did the install finish?" into a QEMU
# process exit code the harness can read, instead of something a human has to
# watch for - REQ-EMU-002.
#------------------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
d-i finish-install/keep-consoles boolean true
d-i cdrom-detect/eject boolean true
d-i debian-installer/exit/poweroff boolean true

#------------------------------------------------------------------------------
# Run-specific and architecture-specific settings.
# Resolved relative to this file's own URL. Must stay last - later wins.
#------------------------------------------------------------------------------
d-i preseed/include string overrides.cfg
