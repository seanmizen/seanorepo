[General]
__userfile__=true
panels=panel1

[panel1]
alignment=-1
animation-duration=0
desktop=0
hidable=false
iconSize=24
lineCount=1
lockPanel=true
opacity=100
panelSize=40
plugins=fancymenu, quicklaunch, taskbar, statusnotifier, volume, worldclock, showdesktop
position=Bottom
reserve-space=true
show-delay=0
visible-margin=false
width=100
width-percent=true

[fancymenu]
alignment=Left
autoSel=false
filterClear=true
icon=/usr/share/icons/desktop-base/scalable/emblems/emblem-debian-white.svg
ownIcon=true
showText=false
type=fancymenu

[quicklaunch]
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/featherpad.desktop
apps\size=3
type=quicklaunch

[taskbar]
autoRotate=false
buttonHeight=40
buttonStyle=Icon
buttonWidth=48
closeOnMiddleClick=true
groupingEnabled=true
iconByClass=true
raiseOnCurrentDesktop=false
showGroupOnHover=true
showOnlyCurrentScreenTasks=false
showOnlyMinimizedTasks=false
showOnlyOneDesktopTasks=true
type=taskbar

[statusnotifier]
alignment=Right
type=statusnotifier

[volume]
alignment=Right
type=volume

[worldclock]
alignment=Right
autoRotate=false
customFormat="'<center>'HH:mm'<br/>'dd/MM/yyyy'</center>'"
formatType=custom
showTooltip=true
type=worldclock
useAdvancedManualFormat=true

[showdesktop]
alignment=Right
type=showdesktop
