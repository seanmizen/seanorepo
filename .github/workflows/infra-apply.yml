name: Infra apply (OpenTofu)

# Applies the cloudflare stack when release moves, so a DNS record in git
# goes live without a manual apply. The state is in R2 (versions.tf). The
# github stack needs an admin token, so it stays manual (infra/github).

on:
  push:
    branches: [release]
    paths:
      - 'infra/cloudflare/**'
      - 'infra/tofu'
  workflow_dispatch:

permissions:
  contents: read

# One apply at a time. A queued run waits and does not cancel a running one.
concurrency:
  group: infra-apply-cloudflare
  cancel-in-progress: false

jobs:
  apply:
    name: tofu apply (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch can name any branch. infra/tofu also refuses others.
    if: github.ref == 'refs/heads/release'
    env:
      CLOUDFLARE_SECRETS: /nonexistent
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Init
        run: infra/tofu cloudflare init -input=false

      - name: Plan
        run: |
          infra/tofu cloudflare plan -input=false -no-color -out="$RUNNER_TEMP/tfplan" | tee "$RUNNER_TEMP/plan.txt"
          {
            echo '### tofu plan (cloudflare)'
            echo '```'
            grep -E '^(Plan:|No changes|  # )' "$RUNNER_TEMP/plan.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: infra/tofu cloudflare apply -input=false -no-color "$RUNNER_TEMP/tfplan"

      # apply refuses a checkout with changes, so the plan files are in
      # RUNNER_TEMP. A resource that apply created needs an import block
      # (README.md). The apply is done, so this only warns.
      - name: Import blocks
        run: infra/check-imports.sh || echo "::warning::Add the import blocks above to infra/cloudflare/imports.tf in a new PR."
