name: UX Check (seansconverter)

# Runs the seansconverter.com tests on PRs that touch the converter: the Go
# service, the tool-list unit tests, and the browser flow (Playwright + axe)
# against a real Go server with ffmpeg.

on:
  pull_request:
    paths:
      - 'apps/ffmpeg-converter/**'

permissions:
  contents: read

jobs:
  ux-check:
    name: Go tests, unit tests, Playwright e2e + axe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/ffmpeg-converter/go.mod

      - name: Install ffmpeg 8.1
        # HEIC photos need ffmpeg 7.1 or later. Ubuntu's apt package is older.
        run: |
          curl -sfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar xJ
          echo "$PWD/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        working-directory: apps/ffmpeg-converter/web
        run: yarn playwright install --with-deps chromium

      - name: Go tests
        working-directory: apps/ffmpeg-converter
        run: go test ./...

      - name: Unit tests
        run: yarn workspace ffmpeg-converter-next test

      - name: Playwright e2e + axe
        # playwright.config.ts starts the Go server and the Next.js server.
        run: yarn workspace ffmpeg-converter-next test:e2e
