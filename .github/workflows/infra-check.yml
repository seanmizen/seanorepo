name: Infra check (OpenTofu)

# Checks the OpenTofu stacks without secrets: format, validate, and one
# import block for each resource. A PR gets no Cloudflare token: a plan
# reads the R2 buckets, and a token that can do that can also read the crm
# backups. infra-apply.yml plans and applies cloudflare on release, and shows
# the plan in its run summary. The github stack plans and applies on Sean's
# machine only.

on:
  pull_request:
    paths:
      - 'infra/**'

permissions:
  contents: read

jobs:
  check:
    name: tofu fmt + validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One stack's failure must not cancel the other's check.
      fail-fast: false
      matrix:
        stack: [cloudflare, github]
    # Placeholders: nothing here calls an API. The github stack's wrapper
    # wants a token even for fmt.
    env:
      CLOUDFLARE_SECRETS: /nonexistent
      GITHUB_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Format
        run: infra/tofu ${{ matrix.stack }} fmt -check -recursive

      - name: Validate
        run: |
          infra/tofu ${{ matrix.stack }} init -backend=false -input=false
          infra/tofu ${{ matrix.stack }} validate

      - name: Every resource has an import block
        run: infra/check-imports.sh
