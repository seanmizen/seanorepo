name: Infra check (OpenTofu)

# Checks infra/cloudflare without secrets: format, and validate on a copy
# without the encrypted state (validate does not need it). Plan and apply
# need the token and the passphrase, so they run on Sean's machine only.

on:
  pull_request:
    paths:
      - 'infra/**'

permissions:
  contents: read

jobs:
  check:
    name: tofu fmt + validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        stack: [cloudflare, github]
    steps:
      - uses: actions/checkout@v4

      - name: Format
        run: infra/tofu ${{ matrix.stack }} fmt -check -recursive

      - name: Validate
        env:
          CLOUDFLARE_SECRETS: /nonexistent
          GITHUB_TOKEN: ci-placeholder
          TF_VAR_state_passphrase: ci-placeholder-no-state-is-read
        run: |
          # A copy without the encrypted state: validate does not need it.
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/${{ matrix.stack }}"
          cp infra/tofu "$tmp/"
          cp infra/${{ matrix.stack }}/*.tf infra/${{ matrix.stack }}/.terraform.lock.hcl "$tmp/${{ matrix.stack }}/"
          "$tmp/tofu" ${{ matrix.stack }} init -input=false
          "$tmp/tofu" ${{ matrix.stack }} validate
