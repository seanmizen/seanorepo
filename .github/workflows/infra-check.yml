name: Infra check (OpenTofu)

# Checks the OpenTofu stacks without secrets: format, validate, and one
# import block for each resource. The plan job shows the cloudflare plan
# with the CLOUDFLARE_API_TOKEN secret. infra-apply.yml applies cloudflare
# on release. The github stack plans and applies on Sean's machine only.

on:
  pull_request:
    paths:
      - 'infra/**'

permissions:
  contents: read

jobs:
  check:
    name: tofu fmt + validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One stack's failure must not cancel the other's check.
      fail-fast: false
      matrix:
        stack: [cloudflare, github]
    # Placeholders: nothing here calls an API. The github stack's wrapper
    # wants a token even for fmt.
    env:
      CLOUDFLARE_SECRETS: /nonexistent
      GITHUB_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Format
        run: infra/tofu ${{ matrix.stack }} fmt -check -recursive

      - name: Validate
        run: |
          infra/tofu ${{ matrix.stack }} init -backend=false -input=false
          infra/tofu ${{ matrix.stack }} validate

      - name: Every resource has an import block
        run: infra/check-imports.sh

  # The plan of the cloudflare stack against the live state in R2, in the
  # job summary. It changes nothing. infra-apply.yml applies on release.
  plan:
    name: tofu plan (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A fork PR gets no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_SECRETS: /nonexistent
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan
        run: |
          infra/tofu cloudflare init -input=false
          infra/tofu cloudflare plan -input=false -lock=false -no-color | tee plan.txt
          {
            echo '### tofu plan (cloudflare)'
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
