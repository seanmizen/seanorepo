name: Check (inside)

# Gate for apps/inside: types, lint, backend unit tests, Playwright E2E and an
# axe accessibility scan.
# Per apps/inside/CLAUDE.md, a feature ticket ships with tests — this is what
# makes that rule real rather than aspirational.
#
# Lint is scoped to apps/inside on purpose: a repo-wide `yarn check` currently
# reports ~138 pre-existing findings elsewhere, which would make this job
# permanently red and therefore ignored.

on:
  pull_request:
    paths:
      - 'apps/inside/**'
      - '.github/workflows/inside-check.yml'
      - '.claude/skills/ste/**'
      - 'requirements/check-test-ids.mjs'
      - 'requirements/check-test-ids.test.mjs'
  # A merge that skipped the gate is still caught, just later. #243 merged with
  # no completed checks — the run finished red on a branch that no longer
  # mattered, and nothing reported it against main.
  push:
    branches: [main]
    paths:
      - 'apps/inside/**'
      - '.github/workflows/inside-check.yml'
      - '.claude/skills/ste/**'
      - 'requirements/check-test-ids.mjs'
      - 'requirements/check-test-ids.test.mjs'

permissions:
  contents: read

jobs:
  check:
    name: types + lint + unit + e2e + a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the STE step diffs against the merge base with main,
          # and the default shallow clone has no merge base to find.
          fetch-depth: 0

      - name: Simplified Technical English (changed files)
        # Only files this PR changed, so the back catalogue does not block work
        # that does not touch it. See .claude/skills/ste/ for the rules.
        # Hard violations fail. Passive voice and compound tenses are advisory.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          python3 .claude/skills/ste/scripts/ste-lint.py --changed apps/inside

      - name: Simplified Technical English (whole app)
        # On main, --changed would diff HEAD against itself and lint nothing,
        # passing without checking anything — the silent-pass shape #237 fixed.
        # apps/inside is at zero hard violations since #238 and #241, so the
        # whole app is a scope this can hold.
        if: github.event_name == 'push'
        run: |
          find apps/inside -type f \( -name '*.md' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path '*/node_modules/*' -not -path '*/dist/*' -print0 \
            | xargs -0 python3 .claude/skills/ste/scripts/ste-lint.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        # Yarn 4 is the package manager. Bun is the runtime only — never
        # `bun install` here.
        run: yarn install --immutable

      - name: Type-check (frontend and backend)
        run: yarn workspace inside test:types

      - name: Lint
        run: npx biome check apps/inside

      - name: Test id convention — self-test
        # Proves the checker itself still catches the #231 shape before
        # trusting it to gate real code below.
        run: node --test requirements/check-test-ids.test.mjs

      - name: Test id convention (REQ-QUALITY-001)
        # Always a full scan of apps/inside/inside-fe/src, on both events — it
        # has no --changed mode to get wrong, unlike the STE step above. #234.
        run: node requirements/check-test-ids.mjs

      - name: Backend unit tests
        run: yarn workspace inside test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: yarn workspace inside test:e2e

      - name: Accessibility (axe)
        # Scans every route in both light and dark. Separate from the E2E step
        # so a contrast regression is named as such in the job log rather than
        # buried among the behavioural specs; `test:e2e` excludes the @axe tag,
        # so nothing runs twice.
        run: yarn workspace inside test:axe

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/inside/inside-fe/playwright-report/
          retention-days: 7

      - name: Assert tests left no artefacts in the repo
        # A leaked database.db or uploads/ means a suite is not using
        # createTestEnv() correctly.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Test run modified tracked files or left artefacts:"
            git status --porcelain
            exit 1
          fi
