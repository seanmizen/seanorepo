approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl
  os:
    - darwin
    - linux

# The repository carries its own Yarn, so any `yarn` on the PATH runs this
# release. No corepack.
yarnPath: .yarn/releases/yarn-4.18.0.cjs
