nodeLinker: node-modules

# Each worktree needs its own node_modules, and a full copy costs about
# 1.2 GB. With hardlinks-global, the files are hard links into the global
# Yarn store, so a worktree install adds almost no disk use.
nmMode: hardlinks-global

# The repository carries its own Yarn, so any `yarn` on the PATH runs this
# release. No corepack.
yarnPath: .yarn/releases/yarn-4.18.0.cjs
