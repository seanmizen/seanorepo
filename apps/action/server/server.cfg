// The deathmatch server config. The server runs it at start: one command a
// line, "//" starts a comment. The commands: set, reset, echo, cvarlist.
// The SV_<NAME> environment variables run after this file and win
// (SV_MATCH_SECONDS=600 sets match_seconds).
//
// The server cvars and their limits: game/src/server_cvars.json.
//
// Remote admin (rcon) stays off while admin_password is empty. Do not put
// the password in this file, it is in the repository: set
// SV_ADMIN_PASSWORD in the environment.

