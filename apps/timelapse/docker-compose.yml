# timelapse - timelapse.seanmizen.com
# Port 4120: the static web build. No backend.

x-frontend-base: &frontend-base
  container_name: timelapse
  build:
    context: ../..
    dockerfile: apps/timelapse/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4120:4120"

services:
  frontend:
    <<: *frontend-base
    profiles: ["prod"]
    restart: unless-stopped
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [timelapse]

  frontend-dev:
    <<: *frontend-base
    volumes:
      - type: bind
        source: ../..
        target: /app
      - fe_node_modules:/app/node_modules
      # package.json sets hoistingLimits, so the app has its own node_modules.
      - app_node_modules:/app/apps/timelapse/node_modules
    profiles: ["dev"]

volumes:
  fe_node_modules:
  app_node_modules:

networks:
  # Shared with infra/edge. deploy.sh and prod:docker create it.
  edge:
    external: true
