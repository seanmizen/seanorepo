# crm - crm.seanmizen.com, and the demo at demo-crm.seanmizen.com
# Port 4100. crm-be renders the pages, serves the crm-fe build, and serves
# the API, in one process. The demo is the same image on host port 4101.
#
# prod: the self-contained image, and the Litestream sidecar. The tunnel
# reaches 127.0.0.1:4100. The crm is not on the LAN edge (infra/edge): its
# sign-in needs HTTPS and its public origin, crm.seanmizen.com.
#
# demo: crm-demo and its Litestream sidecar. The same image, the same code
# and the same settings as prod. Only the env is different: its own volume,
# apps/crm/.env.demo, host port 4101, demo-crm.seanmizen.com and the backup
# prefix demo-crm.db/. scripts/prod-docker.sh adds this profile only when
# apps/crm/.env.demo exists. Without the file, the demo does not start.
#
# dev: bind-mounts the monorepo root, so `@shared/*` resolves. node_modules
# is a named volume that the image fills. This keeps the Linux builds of
# dependencies out of the host's macOS node_modules.

x-crm-base: &crm-base
  container_name: crm
  build:
    context: ../..
    dockerfile: apps/crm/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - '${PUBLISH_ADDR:-127.0.0.1}:4100:4100'

# The secrets of the prod services: apps/crm/.env on the server. Git ignores
# it, and deploy.sh never changes it. The README "Env vars" table names each
# value. Without the file, each one is unset, and unset means off.
x-crm-env-file: &crm-env-file
  env_file:
    - path: ./.env
      required: false

# The Litestream sidecar of a crm database. Config: litestream.yml. Each
# sidecar sets CRM_R2_PATH, the prefix of its backup files in the bucket.
#
# unless-stopped, as each other production service (REQ-SERVER-020). When the
# Docker daemon restarts, it stops each container with status 0. on-failure
# then does not start the sidecar again, and the database has no backup until
# the next deploy.
#
# With no CRM_R2_BUCKET, the container prints that replication is off one
# time, and then waits with no work. It does not stop, so unless-stopped does
# not start it again in a loop. The trap stops it at once on `docker stop`.
x-litestream-base: &litestream-base
  image: litestream/litestream:0.5.17
  restart: unless-stopped
  entrypoint: ['/bin/sh', '-c']
  command:
    - |
      if [ -z "$$CRM_R2_BUCKET" ]; then
        echo "litestream: CRM_R2_BUCKET is not set. Replication is off. The container waits."
        trap 'exit 0' TERM
        sleep infinity &
        wait
        exit 0
      fi
      if [ -z "$$CRM_R2_PATH" ]; then
        echo "litestream: CRM_R2_PATH is not set. Set it in docker-compose.yml." >&2
        exit 1
      fi
      case "$$CRM_R2_ENDPOINT" in
        https://*.eu.r2.cloudflarestorage.com) ;;
        *)
          echo "litestream: CRM_R2_ENDPOINT must be https://<account_id>.eu.r2.cloudflarestorage.com. The bucket is in the EU jurisdiction." >&2
          exit 1
          ;;
      esac
      exec litestream replicate

services:
  crm:
    <<: [*crm-base, *crm-env-file]
    profiles: ['prod']
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4100
      - DB_PATH=/data/crm.db
      - CRM_PUBLIC_URL=https://crm.seanmizen.com
    volumes:
      - crm_sqlite_data:/data
    labels:
      - 'com.docker.compose.service.primary=true'
      - 'description=crm (https://crm.seanmizen.com)'

  # Litestream replicates /data/crm.db to the R2 bucket (EU jurisdiction),
  # under the prefix CRM_R2_PATH. The README has the restore command.
  litestream:
    <<: [*crm-env-file, *litestream-base]
    container_name: crm-litestream
    profiles: ['prod']
    depends_on:
      - crm
    environment:
      - CRM_R2_PATH=crm.db
    volumes:
      - crm_sqlite_data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

  # The demo (demo-crm.seanmizen.com). The same image and settings as crm.
  # Its own volume, env file, host port and public URL. scripts/prod-docker.sh
  # adds the demo profile only when .env.demo exists. The README "Demo"
  # section has the template of the file.
  crm-demo:
    <<: *crm-base
    container_name: crm-demo
    env_file:
      - path: ./.env.demo
        required: false
    profiles: ['demo']
    restart: unless-stopped
    ports:
      - '${PUBLISH_ADDR:-127.0.0.1}:4101:4100'
    environment:
      - NODE_ENV=production
      - PORT=4100
      - DB_PATH=/data/crm.db
      - CRM_PUBLIC_URL=https://demo-crm.seanmizen.com
    volumes:
      - crm_demo_sqlite_data:/data
    labels:
      - 'description=crm demo (https://demo-crm.seanmizen.com)'

  # Litestream for the demo: the same bucket, the prefix demo-crm.db. A test
  # (crm-be/src/demo.test.ts) fails when two sidecars have the same prefix.
  litestream-demo:
    <<: *litestream-base
    container_name: crm-demo-litestream
    env_file:
      - path: ./.env.demo
        required: false
    profiles: ['demo']
    depends_on:
      - crm-demo
    environment:
      - CRM_R2_PATH=demo-crm.db
    volumes:
      - crm_demo_sqlite_data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

  crm-dev:
    <<: *crm-base
    environment:
      - PORT=4100
      - DB_PATH=/data/crm.db
      # Passed through from the host. The README describes each one.
      - CRM_ADMIN_EMAIL
      - CRM_PUBLIC_URL
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - EMAIL_FROM_NAME
    volumes:
      - type: bind
        source: ../..
        target: /app
      - node_modules:/app/node_modules
      - crm_sqlite_dev_data:/data
    profiles: ['dev']
    labels:
      - 'com.docker.compose.service.primary=true'
      - 'description=crm (http://localhost:4100)'

volumes:
  # The live database. It exists only on the machine that runs the prod
  # profile. Litestream copies it to R2.
  crm_sqlite_data:
    name: crm_sqlite_data
  # The demo database. Litestream copies it to R2 under demo-crm.db/.
  crm_demo_sqlite_data:
    name: crm_demo_sqlite_data
  crm_sqlite_dev_data:
    name: crm_sqlite_dev_data
  node_modules:
