# crm. Port: 4100. crm-be renders the pages, serves the crm-fe build, and
# serves the API, in one process.
#
# Dev only. There is no prod profile and no tunnel route yet, so nothing
# deploys this app.
#
# Dev bind-mounts the monorepo root, so `@shared/*` resolves. node_modules is
# a named volume that the image fills. This keeps the Linux builds of
# dependencies out of the host's macOS node_modules.

services:
  crm-dev:
    container_name: crm
    build:
      context: ../..
      dockerfile: apps/crm/dockerfile
      target: ${BUILD_TARGET:-dev}
    ports:
      - '${PUBLISH_ADDR:-127.0.0.1}:4100:4100'
    environment:
      - PORT=4100
      - DB_PATH=/data/crm.db
    volumes:
      - type: bind
        source: ../..
        target: /app
      - node_modules:/app/node_modules
      - sqlite_data:/data
    profiles: ['dev']
    labels:
      - 'com.docker.compose.service.primary=true'
      - 'description=crm (http://localhost:4100)'

volumes:
  sqlite_data:
  node_modules:
