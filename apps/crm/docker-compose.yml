# crm. Ports: 4100 (FE) / 4101 (BE).
#
# Dev only. There is no prod profile and no tunnel route yet, so nothing
# deploys this app.
#
# Dev bind-mounts the monorepo root, so `@shared/*` resolves from both
# packages. node_modules is a named volume that the image fills. This keeps
# the Linux builds of dependencies out of the host's macOS node_modules.

services:
  frontend-dev:
    container_name: frontend-crm
    build:
      context: ../..
      dockerfile: apps/crm/crm-fe/dockerfile
      target: ${BUILD_TARGET:-dev}
    ports:
      - '${PUBLISH_ADDR:-127.0.0.1}:4100:4100'
    environment:
      - API_URL=${API_URL:-http://localhost:4101/api}
    volumes:
      - type: bind
        source: ../..
        target: /app
      - fe_node_modules:/app/node_modules
    profiles: ['dev']
    labels:
      - 'com.docker.compose.service.primary=true'
      - 'description=crm - Frontend (http://localhost:4100)'

  backend-dev:
    container_name: backend-crm
    build:
      context: ../..
      dockerfile: apps/crm/crm-be/dockerfile
      target: ${BUILD_TARGET:-dev}
    ports:
      - '${PUBLISH_ADDR:-127.0.0.1}:4101:4101'
    environment:
      - PORT=4101
      - DB_PATH=/data/crm.db
      - CORS_ORIGIN=http://localhost:4100
    volumes:
      - type: bind
        source: ../..
        target: /app
      - be_node_modules:/app/node_modules
      - sqlite_data:/data
    profiles: ['dev']
    labels:
      - 'description=crm - Backend API (http://localhost:4101/api)'

volumes:
  sqlite_data:
  fe_node_modules:
  be_node_modules:
