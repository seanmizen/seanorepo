# Litestream: the crm database to the R2 bucket `crm`.
#
# docker-compose.yml runs it in the prod profile, only when CRM_R2_BUCKET
# has a value. Litestream expands ${VAR} from its env (apps/crm/.env). It
# reads LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY by itself.
#
# The bucket is in the EU jurisdiction (infra/cloudflare/r2.tf). Only the EU
# endpoint, https://<account_id>.eu.r2.cloudflarestorage.com, reaches it.

# A fixed retention, so erased data expires from the backups
# (docs/001-guiding-design.md, "SQLite and backups"). 2160h is 90 days.
snapshot:
  interval: 24h
  retention: 2160h

dbs:
  - path: /data/crm.db
    replica:
      type: s3
      bucket: ${CRM_R2_BUCKET}
      # The prefix of the backup files in the bucket.
      path: crm.db
      endpoint: ${CRM_R2_ENDPOINT}
      region: auto
