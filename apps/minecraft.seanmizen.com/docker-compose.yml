x-frontend-base: &frontend-base
  container_name: minecraft-seanmizen-com
  build:
    context: ../..
    dockerfile: apps/minecraft.seanmizen.com/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4042:4042"

services:
  frontend:
    <<: *frontend-base
    profiles: ["prod"]
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [minecraft-seanmizen-com]

  frontend-dev:
    <<: *frontend-base
    volumes:
      - type: bind
        source: ../..
        target: /app
      - fe_node_modules:/app/node_modules
    profiles: ["dev"]

volumes:
  fe_node_modules:

networks:
  # Shared with infra/edge. deploy.sh and prod:docker create it.
  edge:
    external: true
