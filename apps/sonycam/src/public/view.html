<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sonycam view</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img id="live" src="/api/live.mjpeg" alt="" />
    <script>
      // Reconnect if the stream drops (server restart, source change).
      const img = document.getElementById('live');
      img.onerror = () =>
        setTimeout(() => {
          img.src = `/api/live.mjpeg?t=${Date.now()}`;
        }, 1000);
    </script>
  </body>
</html>
