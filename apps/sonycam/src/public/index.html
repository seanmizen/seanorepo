<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sonycam</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --fg: #1c1c1a;
        --muted: #6b6b66;
        --panel: #ffffff;
        --border: #dcdcd6;
        --accent: #2b59c3;
        --rec: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141413;
          --fg: #ececea;
          --muted: #9a9a94;
          --panel: #1f1f1d;
          --border: #34342f;
          --accent: #7aa2ff;
          --rec: #ef5350;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.4 system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }
      .preview {
        background: #000;
        aspect-ratio: 3 / 2;
        border-radius: 8px;
        overflow: hidden;
        display: grid;
        place-items: center;
        color: #888;
      }
      .preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.rec[aria-pressed="true"] {
        border-color: var(--rec);
        background: var(--rec);
        color: #fff;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .status {
        color: var(--muted);
        font-size: 13px;
        margin-left: auto;
      }
      .msg {
        min-height: 1.4em;
        color: var(--rec);
      }
      code {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="margin: 0; font-size: 20px">sonycam</h1>
      <div class="preview" id="preview">No source</div>
      <div class="bar">
        <button id="wifi" aria-pressed="false">Wi-Fi</button>
        <button id="usb" aria-pressed="false">USB</button>
        <button id="off">Stop</button>
        <button id="rec" class="rec" aria-pressed="false" disabled>
          Record
        </button>
        <button id="photo" disabled>Photo</button>
        <span class="status" id="status"></span>
      </div>
      <div class="msg" id="msg"></div>
      <p style="color: var(--muted); margin: 0">
        Webcam: in OBS, add a Browser Source with URL
        <code id="viewUrl"></code> (width 1024, height 680), then click
        <b>Start Virtual Camera</b>.
      </p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      $('viewUrl').textContent = `${location.origin}/view`;
      let lastFrames = 0;
      let lastTime = Date.now();

      const api = async (method, path, body) => {
        $('msg').textContent = '';
        const res = await fetch(path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error ?? res.statusText);
        return data;
      };

      const run = (fn) => async (event) => {
        const btn = event.currentTarget;
        btn.disabled = true;
        try {
          await fn();
        } catch (err) {
          $('msg').textContent = err.message;
        } finally {
          btn.disabled = false;
          refresh();
        }
      };

      const showPreview = (on) => {
        const el = $('preview');
        el.textContent = '';
        if (!on) {
          el.textContent = 'No source';
          return;
        }
        const img = document.createElement('img');
        img.src = `/api/live.mjpeg?t=${Date.now()}`;
        img.alt = 'Live view';
        el.append(img);
      };

      let current = null;
      const refresh = async () => {
        const s = await api('GET', '/api/status').catch(() => null);
        if (!s) return;
        if (s.source !== current) showPreview(Boolean(s.source));
        current = s.source;
        $('wifi').setAttribute('aria-pressed', s.source === 'wifi');
        $('usb').setAttribute('aria-pressed', s.source === 'usb');
        $('rec').disabled = !s.canRecord;
        $('photo').disabled = !s.canRecord;
        $('rec').setAttribute('aria-pressed', s.recording);
        $('rec').textContent = s.recording ? 'Stop recording' : 'Record';
        const now = Date.now();
        const fps = ((s.frames - lastFrames) * 1000) / (now - lastTime);
        lastFrames = s.frames;
        lastTime = now;
        $('status').textContent = s.source
          ? `${s.source} · ${fps.toFixed(1)} fps · ${s.clients} viewer(s)`
          : 'idle';
      };

      $('wifi').onclick = run(() => api('POST', '/api/source', { kind: 'wifi' }));
      $('usb').onclick = run(() => api('POST', '/api/source', { kind: 'usb' }));
      $('off').onclick = run(() => api('DELETE', '/api/source'));
      $('rec').onclick = run(() =>
        api('POST', '/api/record', {
          on: $('rec').getAttribute('aria-pressed') !== 'true',
        }),
      );
      $('photo').onclick = run(async () => {
        const { url } = await api('POST', '/api/photo');
        $('msg').textContent = url ? `Photo taken: ${url}` : 'Photo taken.';
      });

      refresh();
      setInterval(refresh, 2000);
    </script>
  </body>
</html>
