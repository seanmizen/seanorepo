# cous - cous.seanmizen.com
# Ports: 4070 (FE) / 4071 (BE).

x-frontend-base: &frontend-base
  container_name: cous
  build:
    context: ../..
    dockerfile: apps/cous/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4070:4070"

x-backend-base: &backend-base
  container_name: cous-backend
  build:
    context: ../..
    dockerfile: apps/cous/cous-be/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4071:4071"
  environment:
    - PORT=4071
    # On the named volume, so a redeploy keeps the scores.
    - DB_PATH=/app/db/scores.sqlite

services:
  frontend:
    <<: *frontend-base
    profiles: ["prod"]
    restart: unless-stopped
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [cous]

  frontend-dev:
    <<: *frontend-base
    environment:
      - API_PROXY_TARGET=http://backend-dev:4071
    volumes:
      - type: bind
        source: ../..
        target: /app
      - fe_node_modules:/app/node_modules
    profiles: ["dev"]

  backend:
    <<: *backend-base
    profiles: ["prod"]
    restart: unless-stopped
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [cous-backend]
    volumes:
      - scores_data:/app/db

  backend-dev:
    <<: *backend-base
    profiles: ["dev"]
    volumes:
      - type: bind
        source: ../..
        target: /app
      - be_node_modules:/app/node_modules
      - scores_data:/app/db

volumes:
  scores_data:
  fe_node_modules:
  be_node_modules:

networks:
  # Shared with infra/edge. deploy.sh and prod:docker create it.
  edge:
    external: true
