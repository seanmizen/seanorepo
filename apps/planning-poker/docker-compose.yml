x-frontend-base: &frontend-base
  container_name: frontend-pp
  build:
    context: ../..
    dockerfile: apps/planning-poker/frontend/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4030:4030"

x-backend-base: &backend-base
  container_name: backend-pp
  build:
    context: ../..
    dockerfile: apps/planning-poker/backend/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4031:4031"
  environment:
    - DB_PATH=/app/db

services:
  frontend:
    <<: *frontend-base
    profiles: ["prod"]
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [planning-poker-frontend]

  frontend-dev:
    <<: *frontend-base
    volumes:
      - type: bind
        source: ../../apps/planning-poker/frontend
        target: /app
      - fe_node_modules:/app/node_modules
    profiles: ["dev"]

  backend:
    <<: *backend-base
    profiles: ["prod"]
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [planning-poker-backend]
    volumes:
      - sqlite_data:/app/db

  backend-dev:
    <<: *backend-base
    command: []
    profiles: ["dev"]
    volumes:
      - type: bind
        source: ../../apps/planning-poker
        target: /app
      - be_node_modules:/app/backend/node_modules
      - sqlite_data:/app/db

volumes:
  sqlite_data:
  fe_node_modules:
  be_node_modules:

networks:
  # Shared with infra/edge. deploy.sh and prod:docker create it.
  edge:
    external: true
