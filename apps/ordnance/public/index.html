<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>ORDNANCE</title>
    <meta name="description" content="A logistics RTS. Keep the trucks out of sight of the guns." />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #aac8cd;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      #canvas { display: block; width: 100vw; height: 100vh; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #overlay.hidden { display: none; }
      #overlay .card { max-width: 30rem; padding: 2rem; background: #000; border-top: 2px solid #ffaa3c; }
      #overlay h1 { margin: 0 0 0.75rem; font-size: 1.4rem; letter-spacing: 0.08em; }
      #overlay p { margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div class="card">
        <h1 id="title">ORDNANCE</h1>
        <p id="message">Loading...</p>
      </div>
    </div>
  </body>
</html>
