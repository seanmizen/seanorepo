<title>QuarterCompany Playback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky console bar over three panes. Staff on the left, the turn
   printed on green-bar fanfold paper in the middle, the host's disk on the
   right. The panes stack at phone width. */
:root {
  --paper: #f6f7f1;
  --bar: #e4eedb;
  --panel: #ffffff;
  --ink: #1d2721;
  --muted: #5d6b62;
  --rule: #cfd9ca;
  --accent: #2c6a4c;
  --accent-ink: #ffffff;
  --hole: #dfe4d9;
  --warn: #9a4d12;
  --bad: #a22b2b;
  --sleep: #4f5d96;
  --chg: #fff0b8;
  --inject: #7b3a94;
  --inject-bg: #f4e9f8;
  --card: #fffffb;
  --thought: #8a5a12;
  --thought-bg: #fbf3e4;
  --font-display: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'IBM Plex Sans', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111613; --bar: #17201a; --panel: #151b17; --ink: #dce6dd; --muted: #93a396;
    --rule: #2a362e; --accent: #7cc39a; --accent-ink: #0d1510; --hole: #0b0f0c;
    --warn: #e2a062; --bad: #ec7b7b; --sleep: #a2addf; --chg: #3d3812; --inject: #d6a0ec; --inject-bg: #281c2e; --card: #1a211c; --thought: #e6c27e; --thought-bg: #241f15; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111613; --bar: #17201a; --panel: #151b17; --ink: #dce6dd; --muted: #93a396;
  --rule: #2a362e; --accent: #7cc39a; --accent-ink: #0d1510; --hole: #0b0f0c;
  --warn: #e2a062; --bad: #ec7b7b; --sleep: #a2addf; --chg: #3d3812; --inject: #d6a0ec; --inject-bg: #281c2e; --card: #1a211c; --thought: #e6c27e; --thought-bg: #241f15; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 14px/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.console {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--rule);
  padding-block: 12px; padding-inline: 16px;
  display: grid; gap: 10px;
}
.console-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.eyebrow { font: 600 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.run-name { font: 700 22px/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.run-meta { color: var(--muted); font-size: 13px; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.btn {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 4px;
  padding: 4px 10px; cursor: pointer; font: 500 13px/1.4 var(--font-mono);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* Fixed widths: the slider beside them must not resize while it is dragged.
   24ch fits "Mon FY1 Q1 day 65, 16:45". 16ch fits "fy10-q4-d65-t32". */
.clock, .label { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { width: 24ch; font: 600 18px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.label { width: 16ch; font: 500 13px/1.2 var(--font-mono); color: var(--muted); }
#scrub { flex: 1 1 220px; min-width: 0; accent-color: var(--accent); }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px/1.4 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

main {
  display: grid; gap: 16px; padding-block: 16px; padding-inline: 16px;
  grid-template-columns: minmax(230px, 280px) minmax(0, 1fr) minmax(280px, 380px);
  align-items: start;
}
@media (max-width: 1080px) { main { grid-template-columns: minmax(220px, 260px) minmax(0, 1fr); } .disk { grid-column: 1 / -1; } }
@media (max-width: 720px) { main { grid-template-columns: minmax(0, 1fr); } }
.pane-title { font: 600 15px/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }

.staff { display: grid; gap: 8px; }
.seat { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.seat-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.seat-name { font-weight: 600; }
.seat-title { color: var(--muted); font-size: 12px; }
.pill { font: 600 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; white-space: nowrap; border: 1px solid currentColor; }
.pill.working { color: var(--accent); }
.pill.asleep { color: var(--sleep); }
.pill.absent { color: var(--muted); border-style: dashed; }
.pill.idle { color: var(--muted); }
/* People who join or leave during the run (REQ-QC-020). */
.pill.joined { color: var(--accent); background: var(--bar); }
.pill.left { color: var(--warn); border-style: dashed; }
.seat.new { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.log > li.join { box-shadow: inset 3px 0 0 var(--accent); }
.join-tag { font: 600 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 3px 5px; margin-right: 6px; }
.actor { font: 12px/1.3 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.meter { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); }
.meter-label { font: 11px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--ink); border-left: 2px solid var(--rule); padding-left: 8px; overflow-wrap: anywhere; }
.note.old { color: var(--muted); }

/* The turn log is a printout: tractor-feed holes in the margin, green bars every other line. */
.printout {
  position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 2px;
  padding: 0 28px; min-width: 0;
  background-image:
    radial-gradient(circle at 12px 14px, var(--hole) 0 5px, transparent 5.5px),
    radial-gradient(circle at calc(100% - 12px) 14px, var(--hole) 0 5px, transparent 5.5px);
  background-size: 100% 28px; background-repeat: repeat-y;
}
.printout-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 12px 6px 10px; border-bottom: 1px dashed var(--rule); font: 12px/1.4 var(--font-mono); color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; font: 12.5px/1.55 var(--font-mono); }
.log > li { padding: 5px 6px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; }
.log > li:nth-child(odd) { background: var(--bar); }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.who { font-weight: 600; }
.tool { color: var(--accent); font-weight: 600; }
.fail { color: var(--bad); }
.warn { color: var(--warn); }
.sleep { color: var(--sleep); }
.dim { color: var(--muted); }
.mins { color: var(--muted); font-variant-numeric: tabular-nums; }
.log details { margin-top: 2px; }
.log summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
.log pre, .file pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--font-mono); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
.empty { padding: 18px 6px; color: var(--muted); font: 12.5px/1.5 var(--font-mono); }

.disk { display: grid; gap: 12px; min-width: 0; }
.tree, .file { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.tree { font: 12.5px/1.6 var(--font-mono); max-height: 60vh; overflow: auto; }
.tree details > div { padding-left: 14px; }
.tree summary { cursor: pointer; list-style: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: '▸ '; color: var(--muted); }
.tree details[open] > summary::before { content: '▾ '; }
.tree .f { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0 0 0 1.2em; cursor: pointer; font: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .f:hover, .tree .f.sel { color: var(--accent); }
.tree .chg { background: var(--chg); border-radius: 2px; }
.tag { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); margin-left: 6px; }
.host { font-weight: 600; }
.file h3 { margin: 0 0 4px; font: 600 13px/1.3 var(--font-mono); overflow-wrap: anywhere; }
.ls { font: 11.5px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.removed { font: 12px/1.5 var(--font-mono); color: var(--bad); }
/* Mail and documents, printed into the log so a narrator can read them on screen. */
.mail { margin-top: 6px; background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 12px; max-width: 72ch; }
.mail-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; font: 12px/1.5 var(--font-mono); color: var(--muted); padding-bottom: 6px; border-bottom: 1px dashed var(--rule); }
.mail-head dt { font-weight: 600; }
.mail-head dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
.mail-head dd.subj { font-weight: 600; }
.mail-body { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13.5px/1.55 var(--font-body); color: var(--ink); }
.mail-kind { font: 600 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.doc { margin-top: 6px; background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; max-width: 72ch; }
.doc pre { margin: 0; }
.inbox { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; max-width: 72ch; }
.inbox li { display: grid; grid-template-columns: 3.5em minmax(0, 1fr); gap: 8px; font-size: 12px; }
.inbox .new { color: var(--accent); font-weight: 600; }

/* Collapsed details: one summary line, click to open. */
.fold { margin-top: 4px; }
.fold > summary { cursor: pointer; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.fold > summary:hover { color: var(--ink); }
.fold > summary .gist { color: var(--ink); }
.log-tools { display: inline-flex; gap: 6px; }
.btn.small { padding: 2px 8px; font-size: 11.5px; }

/* Private thoughts: out of universe. Nobody in the company can read them. */
.log > li.thought { background: var(--thought-bg); box-shadow: inset 3px 0 0 var(--thought); }
.thinks { font: 600 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--thought); border: 1px dotted var(--thought); border-radius: 3px; padding: 3px 5px; margin-right: 6px; }
.thought-text { font-style: italic; color: var(--ink); }
.seat .thought-line { font-size: 12px; font-style: italic; color: var(--thought); overflow-wrap: anywhere; }

/* Scenario mail has its own colour: the scenario wrote it, not a seat. */
.log > li.inject { background: var(--inject-bg); box-shadow: inset 3px 0 0 var(--inject); }
.mail.inject { border-color: var(--inject); box-shadow: inset 3px 0 0 var(--inject); }
.badge-inject { position: relative; display: inline-block; font: 600 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--inject); border: 1px solid var(--inject); border-radius: 3px; padding: 3px 5px; cursor: help; margin-right: 6px; }
.badge-inject:hover::after, .badge-inject:focus::after {
  content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); z-index: 4; width: min(320px, 70vw);
  background: var(--panel); color: var(--ink); border: 1px solid var(--inject); border-radius: 4px; padding: 8px 10px;
  font: 12px/1.45 var(--font-body); letter-spacing: 0; text-transform: none; white-space: normal; box-shadow: 0 4px 14px rgba(0,0,0,.15);
}
.legend { display: inline-flex; align-items: center; gap: 4px; }
/* Populations: a crowd is one row per turn, not one row per person (REQ-QC-023). */
.seat.pop { border-style: dashed; }
.log > li.pop { box-shadow: inset 3px 0 0 var(--sleep); }
.pop-tag { font: 600 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--sleep); border: 1px solid var(--sleep); border-radius: 3px; padding: 3px 5px; margin-right: 6px; }
.pop-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.more { color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="console">
  <div class="console-top">
    <span class="eyebrow">QuarterCompany playback</span>
    <h1 class="run-name" id="run-name">Run</h1>
    <span class="run-meta" id="run-meta"></span>
  </div>
  <div class="transport">
    <button class="btn" id="prev" type="button" aria-label="Previous turn">◀ Prev</button>
    <button class="btn primary" id="play" type="button">Play</button>
    <button class="btn" id="next" type="button" aria-label="Next turn">Next ▶</button>
    <span class="clock" id="clock">--:--</span>
    <span class="label" id="turn-label"></span>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Turn">
    <label class="toggle"><input id="quiet" type="checkbox"> Show quiet turns</label>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section aria-labelledby="staff-h">
    <h2 class="pane-title" id="staff-h">Staff</h2>
    <div class="staff" id="staff"></div>
  </section>
  <section aria-labelledby="log-h" style="min-width:0">
    <h2 class="pane-title" id="log-h">Turn log</h2>
    <div class="printout">
      <div class="printout-head"><span id="log-title"></span><span class="log-tools"><button class="btn small" id="expand" type="button">Expand all</button><button class="btn small" id="collapse" type="button">Collapse all</button></span><span class="legend"><span class="badge-inject" tabindex="0" data-tip="Purple marks what the scenario or the director caused. A system event is the physics of the world, such as a host or mail outage. A compelled action is a real action that a person was made to take, in their own session.">Scenario</span><span id="log-side"></span></span></div>
      <ol class="log" id="log"></ol>
    </div>
  </section>
  <section class="disk" aria-labelledby="disk-h">
    <div>
      <h2 class="pane-title" id="disk-h">Disk at end of turn</h2>
      <div class="tree" id="tree"></div>
    </div>
    <div class="file" id="file"><div class="empty">Select a file to read it. Changed files are marked.</div></div>
  </section>
</main>

<script type="application/json" id="qc-data">"__QC_DATA__"</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('qc-data').textContent);
  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : String(kid));
    return n;
  };

  // ----- fold the journal, the same way the engine does -----
  const key = (host, path) => host + ':' + path;
  function apply(fs, e, label) {
    switch (e.type) {
      case 'fs.mkdir':
        if (!fs.has(key(e.host, e.path))) fs.set(key(e.host, e.path), { kind: 'dir', owner: e.owner, group: e.group, mode: e.mode, mtime: label });
        break;
      case 'fs.write':
        fs.set(key(e.host, e.path), { kind: 'file', hash: e.hash, size: e.size, owner: e.owner, group: e.group, mode: e.mode, mtime: label });
        break;
      case 'fs.rm':
        fs.delete(key(e.host, e.path));
        break;
      case 'fs.mv': {
        const from = key(e.host, e.from);
        const moved = [...fs].filter(([k]) => k === from || k.startsWith(from + '/'));
        for (const [k] of moved) fs.delete(k);
        for (const [k, n] of moved) fs.set(key(e.host, e.to) + k.slice(from.length), k === from ? { ...n, mtime: label } : n);
        break;
      }
      case 'fs.meta': {
        const n = fs.get(key(e.host, e.path));
        if (n) fs.set(key(e.host, e.path), { ...n, owner: e.owner ?? n.owner, group: e.group ?? n.group, mode: e.mode ?? n.mode, mtime: label });
        break;
      }
    }
  }
  const snaps = [];
  function snapshot(i) {
    let start = i;
    while (start >= 0 && !snaps[start]) start--;
    let fs = start >= 0 ? snaps[start] : new Map();
    for (let j = start + 1; j <= i; j++) {
      fs = new Map(fs);
      for (const e of D.turns[j].events) apply(fs, e, D.turns[j].label);
      snaps[j] = fs;
    }
    return snaps[i];
  }

  // ----- helpers -----
  const seatIndex = new Map(D.seats.map((s, i) => [s.id, i]));
  const short = (id) => id.split('@')[0];
  const hhmm = (clock) => (clock.match(/(\d\d):(\d\d)$/) || ['', '09', '00']).slice(1).map(Number);
  const fmtTime = ([hh, mm], add) => {
    const t = hh * 60 + mm + add;
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  };
  const modeStr = (n) => {
    let s = n.kind === 'dir' ? 'd' : '-';
    const bits = 'rwxrwxrwx';
    for (let i = 0; i < 9; i++) s += n.mode & (1 << (8 - i)) ? bits[i] : '-';
    return s;
  };
  const clip = (v, n) => {
    const s = (typeof v === 'string' ? v : JSON.stringify(v)).replace(/\s+/g, ' ');
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  };
  const argSummary = (tool, a) => {
    a = a || {};
    if (tool === 'send_mail') return 'to ' + clip(a.to, 50) + ' “' + clip(a.subject || '', 60) + '”';
    if (tool === 'write_file' || tool === 'append_file') return (a.path || '') + ' (' + String(a.content || '').length + ' chars)';
    if (tool === 'end_turn') return '';
    if (tool === 'place_person') return (a.full_name || '') + ' (' + (a.username || '') + ') at ' + (a.client || '');
    return Object.entries(a).map(([k, v]) => (k === 'sudo' ? (v ? 'sudo' : '') : clip(v, 48))).filter(Boolean).join(' ');
  };
  const passwdCache = new Map();
  function passwdUsers(fs, host) {
    const n = fs.get(key(host, '/etc/passwd'));
    if (!n) return new Set();
    if (!passwdCache.has(n.hash))
      passwdCache.set(n.hash, new Set(D.objects[n.hash].split('\n').filter((l) => l && !l.endsWith(':/sbin/nologin')).map((l) => l.split(':')[0])));
    return passwdCache.get(n.hash);
  }
  const pops = D.populations || [];
  const popName = (id) => (pops.find((p) => p.id === id) || { name: id }).name;

  // ----- view state -----
  let quiet = false;
  let order = [];
  let pos = 0;
  let selected = null; // { host, path }
  let timer = null;
  let expandAll = false;
  try { expandAll = localStorage.getItem('qc-expand') === '1'; } catch (_) {}
  const isQuiet = (t) => !t.events.some((e) => !['turn.start', 'turn.end', 'seat.end', 'seat.skip'].includes(e.type) || (e.type === 'seat.end' && e.note));
  function rebuildOrder(keepIdx) {
    order = D.turns.map((t, i) => i).filter((i) => quiet || i === 0 || !isQuiet(D.turns[i]));
    $('scrub').max = String(Math.max(0, order.length - 1));
    const at = order.findIndex((i) => i >= keepIdx);
    pos = at === -1 ? order.length - 1 : at;
  }

  // ----- render -----
  function render() {
    const i = order[pos];
    const turn = D.turns[i];
    const fs = snapshot(i);
    const prev = i > 0 ? snapshot(i - 1) : new Map();
    $('scrub').value = String(pos);
    $('clock').textContent = turn.ord === 0 ? 'Genesis' : turn.clock;
    $('turn-label').textContent = turn.label;
    try { history.replaceState(null, '', '#' + turn.label); } catch (_) {}

    // stats
    let cost = 0, calls = 0;
    for (let j = 0; j <= i; j++) for (const e of D.turns[j].events) if (e.type === 'model.call') { cost += e.costUsd; calls++; }
    const working = new Set(), asleep = new Set();
    let popMail = 0;
    for (const e of turn.events) {
      if (e.type === 'tool.call' && e.population) { if (e.tool === 'send_mail' && e.ok) popMail++; continue; }
      if (e.type === 'tool.call' || e.type === 'seat.end') working.add(e.seat);
      if (e.type === 'seat.skip') asleep.add(e.seat);
    }
    $('stats').replaceChildren(

  // ----- mail and documents in the log -----

  // Mail system rows of one kind, folded when there are many of them.

  function renderTree(i, turn, fs, prev) {

        const out = shown.map((p) => {
          const n = fs.get(key(host, p));

          const tag = changed.get(key(host, p));
          const label = [h('span', { class: tag ? 'chg' : null }, name + (n.kind === 'dir' ? '/' : '')), tag && turn.ord > 0 ? h('span', { class: 'tag' }, tag) : null];

          }
          const isSel = selected && selected.host === host && selected.path === p;
          return h('button', { class: 'f' + (isSel ? ' sel' : ''), type: 'button', title: p, onclick: () => { selected = { host, path: p }; render(); } }, ...label);
        });
        if (shown.length < kids.length) out.push(h('div', { class: 'more' }, '… ' + (kids.length - shown.length) + ' more in ' + dir));
        return out;
      };
      out.push(h('details', { open: true }, h('summary', null, h('span', { class: 'host' }, host)), h('div', null, ...build('/'))));
    }
    if (removed.length && turn.ord > 0) out.push(h('div', { class: 'removed' }, 'Removed this turn: ' + removed.join(', ')));
    $('tree').replaceChildren(...out);
  }

  function renderFile(fs) {
    if (!selected) return;
    const n = fs.get(key(selected.host, selected.path));
    const title = h('h3', null, selected.host + ':' + selected.path);
    if (!n) { $('file').replaceChildren(title, h('div', { class: 'empty' }, 'This file does not exist at this turn.')); return; }
    const ls = h('div', { class: 'ls' }, [modeStr(n), n.owner, n.group, (n.size ?? 0) + ' B', 'changed ' + n.mtime].join('  '));
    $('file').replaceChildren(title, ls, n.kind === 'file' ? h('pre', null, D.objects[n.hash] ?? '') : h('div', { class: 'empty' }, 'Folder.'));
  }

  // ----- controls -----
  const go = (p) => { pos = Math.max(0, Math.min(order.length - 1, p)); render(); };
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play'; };
  $('prev').addEventListener('click', () => { stop(); go(pos - 1); });
  $('next').addEventListener('click', () => { stop(); go(pos + 1); });
  $('scrub').addEventListener('input', (ev) => { stop(); go(Number(ev.target.value)); });
  const setExpand = (open) => {
    expandAll = open;
    try { localStorage.setItem('qc-expand', open ? '1' : '0'); } catch (_) {}
    for (const d of document.querySelectorAll('#log details.fold')) d.open = open;
  };
  $('expand').addEventListener('click', () => setExpand(true));
  $('collapse').addEventListener('click', () => setExpand(false));
  $('quiet').addEventListener('change', (ev) => { quiet = ev.target.checked; rebuildOrder(order[pos]); render(); });
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    if (pos >= order.length - 1) pos = -1;
    $('play').textContent = 'Pause';
    go(pos + 1);
    timer = setInterval(() => (pos >= order.length - 1 ? stop() : go(pos + 1)), 1600);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.target instanceof HTMLInputElement && ev.target.type !== 'range') return;
    if (ev.key === 'ArrowRight') { stop(); go(pos + 1); ev.preventDefault(); }
    if (ev.key === 'ArrowLeft') { stop(); go(pos - 1); ev.preventDefault(); }
  });

  // ----- start -----
  $('run-name').textContent = D.run.name;
  $('run-meta').textContent = 'Scenario ' + D.run.scenario + ' · cast ' + D.run.cast + (D.run.parent ? ' · retake of ' + D.run.parent.run + ' from ' + D.run.parent.turn : '');
  const wanted = D.turns.findIndex((t) => '#' + t.label === location.hash);
  rebuildOrder(0);
  if (wanted > 0) { quiet = !order.includes(wanted) || quiet; if (quiet) { $('quiet').checked = true; rebuildOrder(wanted); } pos = Math.max(0, order.indexOf(wanted)); }
  else pos = Math.min(1, order.length - 1);
  render();
})();
</script>
