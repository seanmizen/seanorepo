<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="colorScheme" name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="inside — a marketplace for architects and interior designers."
    />
    <title>inside.space</title>
  </head>
  <body>
    <script>
      // REQ-THEME-002. Blocking on purpose: resolves the theme before first
      // paint so nobody sees the wrong one flash. Must agree with
      // src/app/theme.ts on BOTH the key and the fallback — 'theme-mode' and
      // 'light' below are hand-kept copies of THEME_STORAGE_KEY and
      // DEFAULT_THEME_MODE, because this runs before any bundle loads and
      // cannot import them.
      //
      // REQ-THEME-003: the fallback is 'light', not 'auto'. Get that wrong
      // here and the flash comes back for exactly one group — visitors whose
      // OS is dark and who have never chosen — which is the sort of bug that
      // survives a casual look.
      (() => {
        var mode = 'light';
        try {
          mode = localStorage.getItem('theme-mode') || 'light';
        } catch {
          // Storage blocked; fall through to the default.
        }
        var theme =
          mode === 'auto'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.body.classList.add(theme);
        document
          .getElementById('colorScheme')
          .setAttribute('content', theme);
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
