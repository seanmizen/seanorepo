# inside — inside.seanmizen.com
# Cloudflared port range: 4060 (FE) / 4061 (BE).
#
# Dev bind-mounts the monorepo root so `@shared/*` resolves from both packages;
# node_modules is a named volume seeded from the image, keeping the Linux
# builds of native deps out of the host's macOS node_modules.

x-frontend-base: &frontend-base
  container_name: frontend-inside
  build:
    context: ../..
    dockerfile: apps/inside/inside-fe/dockerfile
    target: ${BUILD_TARGET:-dev}
    args:
      API_URL: ${API_URL:-/api}
  ports:
    - '4060:4060'
  labels:
    - 'com.docker.compose.service.primary=true'
    - 'description=inside - Frontend (http://localhost:4060)'

x-backend-base: &backend-base
  container_name: backend-inside
  build:
    context: ../..
    dockerfile: apps/inside/inside-be/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - '4061:4061'
  labels:
    - 'description=inside - Backend API (http://localhost:4061/api)'
  # Secrets and SMTP config. Optional so `start:docker` works on a fresh clone
  # with the dev defaults; production refuses to boot without real values, so
  # the deploy host must have this file.
  env_file:
    - path: ./inside-be/.env
      required: false
  environment:
    - PORT=4061
    - DB_PATH=/app/db
    - UPLOADS_PATH=/app/uploads

services:
  frontend:
    <<: *frontend-base
    profiles: ['prod']

  frontend-dev:
    <<: *frontend-base
    volumes:
      - type: bind
        source: ../..
        target: /app
      - fe_node_modules:/app/node_modules
    profiles: ['dev']

  backend:
    <<: *backend-base
    profiles: ['prod']
    volumes:
      - sqlite_data:/app/db
      - uploads_data:/app/uploads

  backend-dev:
    <<: *backend-base
    profiles: ['dev']
    volumes:
      - type: bind
        source: ../..
        target: /app
      - be_node_modules:/app/node_modules
      - sqlite_data:/app/db
      - uploads_data:/app/uploads

volumes:
  sqlite_data:
  uploads_data:
  fe_node_modules:
  be_node_modules:
