# seansconverter.com: the Next.js frontend (4050) and the Go backend (4051).
#
# The tunnel sends seansconverter.com/api/* to the backend and everything
# else to the frontend (apps/cloudflared/config.yml). The frontend also
# proxies /api to the backend, for a machine without the tunnel.
#
# Profiles:
#   dev   - bind-mounts the monorepo, hot reload
#   prod  - production images, detached

x-frontend-base: &frontend-base
  container_name: frontend-converter
  build:
    context: ../..
    dockerfile: apps/ffmpeg-converter/web/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4050:4050"
  environment:
    BACKEND_URL: http://backend-converter:4051
  labels:
    - "com.docker.compose.service.primary=true"
    - "description=seansconverter.com - Frontend (http://localhost:4050)"

x-backend-base: &backend-base
  container_name: backend-converter
  build:
    context: ../..
    dockerfile: apps/ffmpeg-converter/dockerfile
    target: ${BUILD_TARGET:-dev}
  ports:
    - "${PUBLISH_ADDR:-127.0.0.1}:4051:4051"
  environment:
    PORT: "4051"
    DATA_DIR: /data
    # The tests shrink it (web/tests/fixtures.ts). Cloudflare refuses a
    # request over 100 MB, so production keeps the 32 MiB default.
    UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-33554432}
    # Uploads, outputs and the billing database. The service deletes job
    # files after FILE_TTL (1h).
  volumes:
    - converter_data:/data
  labels:
    - "description=seansconverter.com - Backend (http://localhost:4051/api/health)"

services:
  frontend:
    <<: *frontend-base
    profiles: ["prod"]
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [seansconverter-frontend]
    depends_on: [backend]

  frontend-dev:
    <<: *frontend-base
    volumes:
      - type: bind
        source: ../..
        target: /app
      - fe_node_modules:/app/node_modules
      - fe_next_cache:/app/apps/ffmpeg-converter/web/.next
    profiles: ["dev"]
    depends_on: [backend-dev]

  backend:
    <<: *backend-base
    profiles: ["prod"]
    # The edge routes to this service by its alias (infra/edge).
    networks:
      default: {}
      edge:
        aliases: [seansconverter-backend]
    # ffmpeg takes every core it can get. 3 of asus's 8 leave room for the
    # other sites while conversions run. CI checks this value.
    cpus: 3

  backend-dev:
    <<: *backend-base
    profiles: ["dev"]
    volumes:
      - type: bind
        source: ../..
        target: /app
      - converter_data:/data

volumes:
  converter_data:
  fe_node_modules:
  fe_next_cache:

networks:
  # Shared with infra/edge. deploy.sh and prod:docker create it.
  edge:
    external: true
