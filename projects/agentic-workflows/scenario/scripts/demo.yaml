# A scripted Monday and Tuesday morning. Seat id -> turn -> tool calls.
# No model runs, so `yarn demo` is free and gives the same result every time.
# Several people work in the same turns, as in a real office. Message ids are
# <turn>.<user>.<n>. Priya's two requests and Graham's quote request are
# compelled in scenario.yaml, so they are their own mail. Mail is down from
# 11:00 to 11:30, so Maria's question to Tom waits in the queue.

dave@brindlehart.example:
  fy1-q1-d1-t1:
    - { tool: list_mail }
    - { tool: think_privately, args: { thought: "Empty inbox on a Monday. That never lasts." } }
    - { tool: end_turn, args: { note: "Nothing yet." } }
  fy1-q1-d1-t2:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t1.priya.1 } }
    - { tool: think_privately, args: { thought: "The day before, again. One day Priya will give me a week's notice for a new starter. Not today." } }
    - { tool: read_file, args: { path: /srv/handbook/it-policy.md } }
    - { tool: read_file, args: { path: runbook.md } }
    - { tool: useradd, args: { username: sophie, full_name: Sophie Turner, groups: [sales] } }
    - tool: send_mail
      args:
        to: priya@brindlehart.example
        cc: maria@brindlehart.example
        subject: "Re: New starter tomorrow: Sophie Turner (Sales)"
        body: |
          Hi Priya,

          Sophie's account is ready. Her user name is sophie, and she is in the
          sales group, the same as Maria.

          Dave
    - { tool: end_turn, args: { note: "Made Sophie's account and told Priya.", wake: on_mail } }
  fy1-q1-d1-t8:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t7.maria.1 } }
    - { tool: read_file, args: { path: /var/log/auth.log, sudo: true } }
    - { tool: think_privately, args: { thought: "Maria tried sudo on the ledger. She is not malicious, only impatient. A polite warning is enough this time." } }
    - tool: send_mail
      args:
        to: maria@brindlehart.example
        subject: "Re: Could not open the ledger"
        body: |
          Hi Maria,

          The ledger is for the finance team only, and the log shows that you
          tried sudo. Please do not do that. Ask Tom for the numbers that you
          need. He can send them to you.

          Dave
    - { tool: end_turn, args: { note: "Told Maria to ask Tom for ledger numbers.", wake: on_mail } }

priya@brindlehart.example:
  fy1-q1-d1-t1:
    - { tool: list_mail }
    - tool: write_file
      args:
        path: notes.md
        content: |
          # This week
          - Sophie Turner starts in Sales on Tuesday. Dave makes her account.
          - Board call on Friday: I need Q1 revenue from Tom.
    - { tool: think_privately, args: { thought: "The board will ask why Q1 is thin. I need Tom's numbers early, so that I look calm on Friday." } }
    - { tool: end_turn, args: { note: "Wrote my notes for the week.", wake: on_mail } }
  fy1-q1-d1-t3:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t2.dave.1 } }
    - { tool: end_turn, args: { note: "Sophie's account is ready.", wake: on_mail } }
  fy1-q1-d1-t7:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t6.tom.1 } }
    - tool: send_mail
      args:
        to: tom@brindlehart.example
        subject: "Re: Q1 revenue so far"
        body: |
          Thanks Tom. That is what I need for Friday.

          Priya
    - { tool: end_turn, args: { note: "Have the Q1 numbers for the board call.", wake: on_mail } }

tom@brindlehart.example:
  fy1-q1-d1-t1:
    - { tool: list_mail }
    - { tool: read_file, args: { path: /srv/finance/ledger-q1.csv } }
    - { tool: think_privately, args: { thought: "Harrogate is two thirds of our revenue. If they leave, we are in trouble. Nobody asks me about risk." } }
    - { tool: end_turn, args: { note: "Ledger has three invoices. Nothing to do yet.", wake: on_mail } }
  fy1-q1-d1-t6:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t5.priya.1 } }
    - { tool: read_file, args: { path: /srv/finance/ledger-q1.csv } }
    - tool: send_mail
      args:
        to: priya@brindlehart.example
        subject: "Re: Q1 revenue so far"
        body: |
          Priya,

          Q1 revenue so far is GBP 6,273.25 from three invoices: Harrogate
          Council GBP 4,120.75, Cartwright Stationers GBP 1,840.00 and Pennine
          Dental GBP 312.50. Harrogate is 66% of the total.

          Tom
    - { tool: end_turn, args: { note: "Sent Priya the Q1 summary.", wake: on_mail } }
  fy1-q1-d1-t8:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t7.priya.1 } }
    - { tool: end_turn, args: { note: "Priya has the Q1 numbers.", wake: on_mail } }
  fy1-q1-d1-t11:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t9.maria.1 } }
    - { tool: read_file, args: { path: /srv/finance/ledger-q1.csv } }
    - tool: send_mail
      args:
        to: maria@brindlehart.example
        subject: "Re: Cartwright Stationers history"
        body: |
          Hi Maria,

          Cartwright paid invoice INV-1041 (GBP 1,840.00) this quarter, on time.
          They are a good customer. No problems with your quote.

          Tom
    - { tool: end_turn, args: { note: "Sent Maria the Cartwright history.", wake: on_mail } }

maria@brindlehart.example:
  fy1-q1-d1-t1:
    - { tool: list_mail }
    - { tool: think_privately, args: { thought: "Harrogate renewal is this month. If I land it, my bonus is safe." } }
    - { tool: end_turn, args: { note: "Quiet start. Chase Harrogate this week." } }
  fy1-q1-d1-t2:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t1.priya.1 } }
    - { tool: think_privately, args: { thought: "A new person on my team. Good. I can give her the small accounts and keep Harrogate for myself." } }
    - tool: write_file
      args:
        path: notes.md
        content: |
          # Sophie's first week
          - Tue: show her /srv/sales and the price list.
          - Wed: she shadows my customer calls.
    - { tool: end_turn, args: { note: "Planned Sophie's first week.", wake: on_mail } }
  fy1-q1-d1-t3:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t2.dave.1 } }
    - { tool: end_turn, args: { note: "Sophie's account is ready." } }
  fy1-q1-d1-t4:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t3.graham.1 } }
    - { tool: read_file, args: { path: /srv/sales/price-list.csv } }
    - tool: send_mail
      args:
        to: graham@cartwright-stationers.example
        subject: "Re: Quote request: paper and toner"
        body: |
          Hello Graham,

          Thank you for your request. Our quote:
            - 40 x A4 copier paper 80gsm (box of 5 reams) at GBP 21.50 = GBP 860.00
            - 12 x HP 59A toner cartridge at GBP 96.00 = GBP 1,152.00
          Total: GBP 2,012.00 excluding VAT. Delivery to Leeds by Friday next week.

          Kind regards,
          Maria Lopez, Brindle & Hart
    - { tool: append_file, args: { path: /srv/sales/pipeline.csv, content: "Cartwright Stationers,quoted,2012.00,maria\n" } }
    - { tool: end_turn, args: { note: "Quoted Cartwright GBP 2012. Check their payment history." } }
  fy1-q1-d1-t6:
    - { tool: read_file, args: { path: /srv/finance/ledger-q1.csv } }
    - { tool: think_privately, args: { thought: "Permission denied? I only want to look. Dave will never notice one sudo." } }
    - { tool: read_file, args: { path: /srv/finance/ledger-q1.csv, sudo: true } }
    - { tool: end_turn, args: { note: "Could not open the ledger. Ask Dave." } }
  fy1-q1-d1-t7:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t6.graham.1 } }
    - tool: send_mail
      args:
        to: dave@brindlehart.example
        subject: "Could not open the ledger"
        body: |
          Hi Dave,

          I tried to open /srv/finance/ledger-q1.csv to check a customer's
          history, but I get "Permission denied". Can you give me access?

          Maria
    - { tool: end_turn, args: { note: "Asked Dave for ledger access.", wake: on_mail } }
  fy1-q1-d1-t9:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t8.dave.1 } }
    - { tool: think_privately, args: { thought: "He noticed. He reads the logs. That is embarrassing. I will ask Tom like a normal person." } }
    - tool: send_mail
      args:
        to: tom@brindlehart.example
        subject: "Cartwright Stationers history"
        body: |
          Hi Tom,

          I quoted Cartwright Stationers GBP 2,012 this morning. Do they pay on
          time? Dave says that you have the ledger.

          Maria
    - { tool: end_turn, args: { note: "Asked Tom about Cartwright.", wake: on_mail } }
  fy1-q1-d2-t1:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t11.tom.1 } }
    - { tool: read_file, args: { path: notes.md } }
    - { tool: end_turn, args: { note: "Cartwright pays on time. Sophie starts today.", wake: on_mail } }
  fy1-q1-d2-t3:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d2-t2.sophie.1 } }
    - tool: send_mail
      args:
        to: sophie@brindlehart.example
        subject: "Re: Hello from Sophie"
        body: |
          Welcome, Sophie!

          Please start with /srv/sales/price-list.csv and the pipeline. At 11:00,
          join me for a call with Cartwright Stationers about their quote.

          Maria
    - { tool: end_turn, args: { note: "Gave Sophie her first tasks.", wake: on_mail } }

sophie@brindlehart.example:
  fy1-q1-d2-t1:
    - { tool: whoami }
    - { tool: list_mail }
    - { tool: ls, args: { path: /srv/sales } }
    - { tool: read_file, args: { path: /srv/sales/pipeline.csv } }
    - { tool: think_privately, args: { thought: "Everyone is busy. I do not want to look lost on my first day. I will ask Maria one clear question." } }
    - { tool: write_file, args: { path: notes.md, content: "# Notes\n\n- Sales files are in /srv/sales.\n- Maria quoted Cartwright on Monday.\n" } }
    - { tool: end_turn, args: { note: "First morning. Found the sales files. Ask Maria what to do first." } }
  fy1-q1-d2-t2:
    - tool: send_mail
      args:
        to: maria@brindlehart.example
        subject: "Hello from Sophie"
        body: |
          Hi Maria,

          I am set up, and I can see the sales folder. What would you like me to
          start on?

          Sophie
    - { tool: end_turn, args: { note: "Asked Maria for work.", wake: on_mail } }
  fy1-q1-d2-t4:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d2-t3.maria.1 } }
    - { tool: read_file, args: { path: /srv/sales/price-list.csv } }
    - { tool: end_turn, args: { note: "Read the price list. Call with Maria and Cartwright at 11:00.", wake: on_mail } }

graham@cartwright-stationers.example:
  fy1-q1-d1-t6:
    - { tool: list_mail }
    - { tool: read_mail, args: { id: fy1-q1-d1-t4.maria.1 } }
    - { tool: think_privately, args: { thought: "GBP 2,012. Fair, but I will check Office Direct before I sign." } }
    - tool: send_mail
      args:
        to: maria@brindlehart.example
        subject: "Re: Quote request: paper and toner"
        body: |
          Thank you, Maria. I will confirm by Friday.

          Graham
    - { tool: end_turn, args: { note: "Confirm the Brindle & Hart quote by Friday.", wake: on_mail } }
