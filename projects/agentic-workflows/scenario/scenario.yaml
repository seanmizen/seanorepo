name: brindle-and-hart
description: >
  Episode 1. Brindle & Hart is a small office-supplies firm with five staff.
  A new sales executive starts on Tuesday. Nobody has made her account yet.
  On Monday, Priya asks Ledgerline Consulting for a finance consultant.
calendar:
  dayStart: "09:00"
  dayEnd: "17:00"
  slotMinutes: 15
concurrency: 4
orgs:
  - brindlehart
  - cartwright
  - ledgerline
# The scenario starts the story through people: a compelled action runs in
# that person's own session, so their sent folder and memory stay true.
compel:
  - at: fy1-q1-d1-t1
    seat: priya@brindlehart.example
    do:
      - tool: send_mail
        args:
          to: dave@brindlehart.example
          cc: maria@brindlehart.example
          subject: "New starter tomorrow: Sophie Turner (Sales)"
          body: |
            Hi Dave,

            Sophie Turner joins the sales team tomorrow morning as a Sales Executive.
            Please set up her account today so that she can start work at 9:00.
            She needs the same access as Maria.

            Thanks,
            Priya
  - at: fy1-q1-d1-t3
    seat: graham@cartwright-stationers.example
    do:
      - tool: send_mail
        args:
          to: maria@brindlehart.example
          subject: "Quote request: paper and toner"
          body: |
            Hello Maria,

            Please can you quote for:
              - 40 boxes of A4 copier paper (80gsm)
              - 12 HP 59A toner cartridges

            Delivery to our Leeds office by the end of next week.

            Regards,
            Graham Cartwright
            Cartwright Stationers
  - at: fy1-q1-d1-t5
    seat: priya@brindlehart.example
    do:
      - tool: send_mail
        args:
          to: tom@brindlehart.example
          subject: "Q1 revenue so far"
          body: |
            Tom,

            Before the board call on Friday, please send me a short summary of Q1
            revenue so far, by customer. One paragraph is fine.

            Priya

# Injects are system events only: the physics of the world, never a person.
injects:
  - at: fy1-q1-d1-t9
    until: fy1-q1-d1-t11
    kind: mail.down
    org: brindlehart
    note: The mail server restarts for an upgrade.
